<div id="library" class="content-section">
    <h2>📚 Номын сангийн суудал захиалга</h2>
    
    <ul class="seat-legend">
        <li><div class="seat available"></div> <small>Сул</small></li>
        <li><div class="seat selected"></div> <small>Сонгосон</small></li>
        <li><div class="seat occupied"></div> <small>Эзэнтэй</small></li>
    </ul>

    <div class="library-container">
        <div class="entrance">Үүд / Ресепшн</div>
        
        <div class="seat-row">
            <div class="seat available" onclick="toggleSeat(this)">A1</div>
            <div class="seat available" onclick="toggleSeat(this)">A2</div>
            <div class="seat-space"></div> <div class="seat occupied">A3</div>
            <div class="seat available" onclick="toggleSeat(this)">A4</div>
        </div>
        
        <div class="seat-row">
            <div class="seat available" onclick="toggleSeat(this)">B1</div>
            <div class="seat occupied">B2</div>
            <div class="seat-space"></div>
            <div class="seat available" onclick="toggleSeat(this)">B3</div>
            <div class="seat available" onclick="toggleSeat(this)">B4</div>
        </div>

        <div class="seat-row">
            <div class="seat available" onclick="toggleSeat(this)">C1</div>
            <div class="seat available" onclick="toggleSeat(this)">C2</div>
            <div class="seat-space"></div>
            <div class="seat occupied">C3</div>
            <div class="seat available" onclick="toggleSeat(this)">C4</div>
        </div>
    </div>

    <div class="booking-info">
        <p>Таны сонгосон суудал: <span id="selected-seat-name">Одоогоор сонгоогүй</span></p>
        <button id="confirm-btn" onclick="confirmBooking()">Суудал захиалах</button>
    </div>
</div>
